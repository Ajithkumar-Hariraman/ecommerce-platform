server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  location = /api/v1/local-product-image {
    access_log off;
    client_max_body_size 5m;
    proxy_pass __API_UPSTREAM__;
    proxy_set_header Host __API_HOST__;
    proxy_ssl_server_name on;
    proxy_ssl_name __API_HOST__;
  }
  location = /api/v1/products/import {
    client_max_body_size 25m;
    proxy_pass __API_UPSTREAM__;
    proxy_set_header Host __API_HOST__;
    proxy_ssl_server_name on;
    proxy_ssl_name __API_HOST__;
  }
  location /api/ {
    proxy_pass __API_UPSTREAM__;
    proxy_set_header Host __API_HOST__;
    proxy_ssl_server_name on;
    proxy_ssl_name __API_HOST__;
  }
  location / { try_files $uri $uri/ /index.html; }
}
