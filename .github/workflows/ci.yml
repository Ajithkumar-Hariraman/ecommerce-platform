name: Platform verification
on:
  pull_request:
  push:
    branches: [main, 'feat/**', 'release/**']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/api
      - run: npm run typecheck && npm test && npm run build
        working-directory: apps/api
      - run: npm ci && npm run typecheck && npm run build
        working-directory: apps/web
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
        working-directory: apps/api
      - name: Generate disposable service credentials
        run: python3 scripts/prepare-ci-env.py
      - name: Validate and build images
        run: |
          docker compose -f infra/compose.yaml config --quiet
          docker compose -f infra/compose.yaml build
      - name: Start real infrastructure
        run: docker compose -f infra/compose.yaml up -d --wait postgres mongodb redis-cache kafka keycloak
      - name: Complete unfiltered integration suite
        run: python3 scripts/run-compose-integration.py
      - name: Full application and HTTP event flow
        run: |
          docker compose -f infra/compose.yaml up -d
          python3 scripts/verify-compose.py
      - name: Service status
        if: always()
        run: docker compose -f infra/compose.yaml ps
      - name: Stop ephemeral job containers
        if: always()
        run: docker compose -f infra/compose.yaml stop
