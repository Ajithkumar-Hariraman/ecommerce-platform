name: Platform verification

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'
      - 'bugfix/**'
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Install API dependencies
        run: npm ci
        working-directory: apps/api

      - name: Verify API
        run: |
          npm run typecheck
          npm test
          npm run build
        working-directory: apps/api

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/web

      - name: Verify frontend
        run: |
          npm run typecheck
          npm test
          npm run build
        working-directory: apps/web

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install API dependencies
        run: npm ci
        working-directory: apps/api

      - name: Generate disposable service credentials
        run: python3 scripts/prepare-ci-env.py

      - name: Validate and build images
        run: |
          docker compose -f infra/compose.yaml config --quiet
          docker compose -f infra/compose.yaml build

      - name: Start real infrastructure
        run: |
          docker compose -f infra/compose.yaml up -d --wait \
            postgres \
            mongodb \
            redis-cache \
            kafka \
            keycloak

      - name: Complete unfiltered integration suite
        run: python3 scripts/run-compose-integration.py

      - name: Full application and HTTP event flow
        run: |
          for backend in postgres mongodb; do
            export ORDER_STORAGE="$backend"
            docker compose -f infra/compose.yaml up -d --wait
            python3 scripts/verify-compose.py
          done

      - name: Diagnose integration failure
        if: failure()
        run: |
          echo "===== Docker Compose status ====="
          docker compose -f infra/compose.yaml ps || true

          echo "===== MongoDB logs ====="
          docker compose -f infra/compose.yaml logs --no-color --tail=200 mongodb || true

          echo "===== PostgreSQL logs ====="
          docker compose -f infra/compose.yaml logs --no-color --tail=100 postgres || true

          echo "===== Redis logs ====="
          docker compose -f infra/compose.yaml logs --no-color --tail=100 redis-cache || true

          echo "===== Kafka logs ====="
          docker compose -f infra/compose.yaml logs --no-color --tail=150 kafka || true

          echo "===== Keycloak logs ====="
          docker compose -f infra/compose.yaml logs --no-color --tail=150 keycloak || true

          echo "===== Application and worker logs ====="
          docker compose -f infra/compose.yaml logs --no-color --tail=100 \
            api web payment-provider outbox-relay order-event-worker || true

      - name: Service status
        if: always()
        run: docker compose -f infra/compose.yaml ps || true

      - name: Stop ephemeral job containers
        if: always()
        run: docker compose -f infra/compose.yaml stop || true
