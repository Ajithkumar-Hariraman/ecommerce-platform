name: Deploy existing GCP platform
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gcp-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
      - run: npm ci && npm run typecheck && npm test && npm run build
        working-directory: apps/api
        env:
          NODE_ENV: test
          OIDC_ALLOW_HTTP: 'false'
      - run: npm ci && npm run typecheck && npm test && npm run build
        working-directory: apps/web
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/release/platform-readiness'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: ecommerce-platform-510208
      REGION: asia-south1
      REGISTRY: asia-south1-docker.pkg.dev/ecommerce-platform-510208/ecommerce-containers
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Require repository-scoped federation configuration
        env:
          PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: test -n "$PROVIDER" && test -n "$ACCOUNT"
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet
      - name: Build and push immutable release images
        run: |
          docker build -t "$REGISTRY/ecommerce-api:$GITHUB_SHA" ./apps/api
          docker build --build-arg VITE_KEYCLOAK_URL=https://ecommerce-keycloak-eoiwssibea-el.a.run.app --build-arg API_UPSTREAM=https://ecommerce-api-eoiwssibea-el.a.run.app --build-arg API_HOST=ecommerce-api-eoiwssibea-el.a.run.app -t "$REGISTRY/ecommerce-web:$GITHUB_SHA" ./apps/web
          docker push "$REGISTRY/ecommerce-api:$GITHUB_SHA"
          docker push "$REGISTRY/ecommerce-web:$GITHUB_SHA"
      - name: Migrate and deploy existing API and workers
        run: |
          DIGEST=$(gcloud artifacts docker images describe "$REGISTRY/ecommerce-api:$GITHUB_SHA" --format='value(image_summary.digest)')
          python3 infra/gcp/deploy.py --existing --region "$REGION" --image "$REGISTRY/ecommerce-api@$DIGEST" --apply
      - name: Deploy existing web service and smoke check
        run: |
          DIGEST=$(gcloud artifacts docker images describe "$REGISTRY/ecommerce-web:$GITHUB_SHA" --format='value(image_summary.digest)')
          gcloud run services update ecommerce-web --project "$PROJECT" --region "$REGION" --image "$REGISTRY/ecommerce-web@$DIGEST" --max-instances=2
          curl --fail --retry 3 https://ecommerce-api-eoiwssibea-el.a.run.app/health
          curl --fail --retry 3 https://ecommerce-api-eoiwssibea-el.a.run.app/ready
          curl --fail --retry 3 --output /dev/null https://ecommerce-web-eoiwssibea-el.a.run.app
